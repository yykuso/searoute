  <!-- searoute:entry-css（ビルド時に MapLibre / ジオコーダー / Tailwind の CSS をここへ非同期読み込みで配置。インライン style より前に置き従来のカスケード順を保つ） -->

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional"
    crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'" />

    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'" />
  <style>
    @font-face {
      font-family: 'Font Awesome 6 Free';
      font-style: normal;
      font-weight: 900;
      font-display: swap;
      src: url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-solid-900.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Font Awesome 6 Brands';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-brands-400.woff2') format('woff2');
    }

    /* MapLibre コントロールの初期位置を確保して CLS を防止 */
    .maplibregl-ctrl-top-left,
    .maplibregl-ctrl-top-right {
      top: env(safe-area-inset-top);
    }
    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .maplibregl-ctrl-top-left,
    .maplibregl-ctrl-bottom-left {
      left: env(safe-area-inset-left);
    }
    .maplibregl-ctrl-top-right,
    .maplibregl-ctrl-bottom-right {
      right: env(safe-area-inset-right);
    }
    /* ジオコーダーの幅を事前確保 */
    .maplibregl-ctrl-geocoder {
      min-width: 200px;
    }

    /* 非同期の common.css より前にバナーの初期レイアウトを確定する */
    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      background: #1e293b;
      color: #f1f5f9;
      padding: 1rem 1.25rem;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.3);
    }
    /* 表示はインラインスクリプトが付ける html[data-cookie-banner="show"] で決める（同意済み・JS 無効時は非表示） */
    .cookie-banner {
      display: none;
    }
    html[data-cookie-banner="show"] .cookie-banner {
      display: block;
    }
    .cookie-banner__body {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .cookie-banner__text {
      flex: 1 1 0;
      margin: 0;
      font-size: 0.75rem;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .cookie-banner__link-btn {
      background: none;
      border: none;
      padding: 0;
      color: #7dd3fc;
      text-decoration: underline;
      cursor: pointer;
      font-size: inherit;
      font-family: inherit;
    }
    .cookie-banner__close {
      flex-shrink: 0;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 0.2rem;
    }
  </style>

  <script>
    // Cookie 同意が無ければ HTML 解析中から Cookie バナーを表示する（旧版のインラインスクリプトと同じ判定。React のハイドレーション前に実行）
    (function () {
      var hasConsent = document.cookie.split('; ').some(function (cookie) { return cookie.split('=')[0] === 'cookieConsent'; });
      if (!hasConsent) document.documentElement.setAttribute('data-cookie-banner', 'show');
    })();
  </script>
